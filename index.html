  if(!admin)return;
  var ph=k?k.photos.slice():[];
  var o=mk('<h3>'+(k?"kitten এডিট":"নতুন kitten")+'</h3><label>নাম</label><input id="kn"><label>জাত</label><input id="kb"><div class="g2"><div><label>বয়স</label><input id="ka" placeholder="3 months"></div><div><label>দাম (৳)</label><input id="kp" type="number" inputmode="numeric"></div></div><div class="g2"><div><label>লিঙ্গ</label><select id="kg"><option value="">—</option><option>Male</option><option>Female</option></select></div><div><label>স্ট্যাটাস</label><select id="ks"><option>available</option><option>reserved</option><option>sold</option></select></div></div><label>বিস্তারিত</label><textarea id="kd" rows="3"></textarea><label>ছবি (৩–৪টি)</label><input id="kf" type="file" accept="image/*" multiple><div class="thumbs" id="kt"></div><div id="km" class="msg"></div><div class="row" style="margin-top:14px"><button class="ghost" id="kc">বাতিল</button><button id="kv">সেভ</button></div>'+(k?'<div class="row" style="margin-top:8px"><button class="danger" id="kx">মুছে ফেলুন</button></div>':''));
  var v=k||{name:"",breed:"Persian",age:"",gender:"",price:"",status:"available",details:""};
  $("#kn").value=v.name;$("#kb").value=v.breed;$("#ka").value=v.age;$("#kp").value=v.price;$("#kg").value=v.gender;$("#ks").value=v.status;$("#kd").value=v.details;
  function th(){$("#kt").innerHTML=ph.map(function(u,i){return'<div><img src="'+esc(u)+'"><b data-rm="'+i+'">×</b></div>'}).join("")}
  th();
  $("#kt").onclick=function(e){var b=e.target.closest("[data-rm]");if(b){ph.splice(+b.dataset.rm,1);th()}};
  $("#kc").onclick=function(){o.remove()};
  $("#kf").onchange=async function(){
    var fl=Array.from(this.files||[]),m=$("#km");if(!fl.length)return;
    m.textContent="ছবি আপলোড হচ্ছে…";
    try{
      for(var f of fl){
        var b=await shrink(f),p=Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
        var u=await sb.storage.from("kitten-photos").upload(p,b,{contentType:"image/jpeg"});
        if(u.error)throw u.error;
        ph.push(sb.storage.from("kitten-photos").getPublicUrl(p).data.publicUrl);th();
      }
      m.textContent="";
    }catch(e){m.textContent="ছবি আপলোড হয়নি: "+(e.message||"")}
    this.value="";
  };
  $("#kv").onclick=async function(){
    var m=$("#km");m.textContent="সেভ হচ্ছে…";
    var row={name:$("#kn").value.trim()||"Persian Kitten",breed:$("#kb").value.trim(),age:$("#ka").value.trim(),gender:$("#kg").value,price:Number($("#kp").value)||0,status:$("#ks").value,details:$("#kd").value.trim(),photos:ph};
    var r=k?await sb.from("kittens").update(row).eq("id",k.id):await sb.from("kittens").insert(row);
    if(r.error){m.textContent="সেভ হয়নি: "+r.error.message;return}
    o.remove();load();
  };
  if(k)$("#kx").onclick=async function(){
    if(!confirm("সত্যিই মুছবেন?"))return;
    var m=$("#km");m.textContent="মুছছে…";
    var r=await sb.from("kittens").delete().eq("id",k.id);
    if(r.error){m.textContent="মোছা হয়নি: "+r.error.message;return}
    o.remove();load();
  };
}
function chk(){if(location.hash==="#admin"&&!admin)showLogin()}
applyLang();
load();
if(sb){
  sb.auth.getSession().then(function(r){setAdmin(!!(r.data&&r.data.session));chk()});
  sb.auth.onAuthStateChange(function(_e,s){var a=!!s;if(a!==admin)setAdmin(a)});
  window.addEventListener("hashchange",chk);
}
</script>
</body>
</html>
