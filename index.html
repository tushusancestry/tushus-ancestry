<script>
(function(){

var rm=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;

var x=16,dir=1,target=W()*.6,state="walk",tm=0,last=0;
function set(s){state=s;pet.dataset.s=s;if(s==="sleep"||s==="peek")pet.classList.remove("fl")}
function next(){
  var r=Math.random();
  if(r<.34){target=Math.random()*W();dir=target>x?1:-1;pet.classList.toggle("fl",dir<0);set("walk")}
  else if(r<.42){set("sit");tm=3000+Math.random()*2000}

  else if(r<.72){set("peek");tm=4500+Math.random()*2500}

  else{set("jump");tm=950}
}

function loop(t){
  var dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(!document.hidden){
    if(state==="walk"){x+=55*dt*dir;if((dir>0&&x>=target)||(dir<0&&x<=target)){x=target;next()}}

    x=Math.min(Math.max(x,0),W());
    pet.style.transform="translateX("+x+"px)";
  }
  requestAnimationFrame(loop);
}
dir=target>x?1:-1;requestAnimationFrame(loop);
})();
</script>
